name: Agent - Priority Screening

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Agent
        run: |
          curl -sf -X POST https://followup-nu.vercel.app/api/agents/priority-screening \
            -H "x-agent-secret: ${{ secrets.AGENT_CRON_SECRET }}"
